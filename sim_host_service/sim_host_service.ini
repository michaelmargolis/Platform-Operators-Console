#sim_host_service.ini  ver 7
# Sim Host Service configuration.
# All simulators are started by batch files stored in the "sims" directory
# immediately below the sim_host_service directory.
# start_batch is the batch filename only; no path or working directory is needed.
# window_class is the primary simulator identifier. window_title is an optional
# case-insensitive fallback. On sim changes SHS sends WM_CLOSE and waits for the
# old process to exit before launching/activating the replacement.

[server]
bind_address = 0.0.0.0
port = 10040
recent_request_count = 128
poc_timeout_s = 3.0

[fan]
# Leave port blank for initial installation. Select and open the detected port
# in the SHS window; it is saved here only after the port opens successfully.
enabled = true
port =
baudrate = 115200
command_timeout_s = 1.0

[spacecoaster_relay]
# Unity sends these legacy datagrams to localhost:10009. SHS forwards the
# bytes unchanged to the IP address of the most recent valid POC heartbeat.
enabled = true
bind_address = 0.0.0.0
listen_port = 10009
target_port = 10009

[sim:nolimits2]
window_class = NL3D_MAIN_{7F825CE1-21E4-4C1B-B657-DE6FCD9AEB12}
window_title = NoLimits 2
start_batch = nolimits2.bat
close_timeout_s = 10

[sim:spacecoaster]
window_class = UnityWndClass
window_title = Coaster MSU
start_batch = spacecoaster.bat
close_timeout_s = 10

[sim:xplane]
window_class =
window_title =
start_batch = xplane.bat
close_timeout_s = 10
